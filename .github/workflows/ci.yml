# CI/CD di Planet Plotted.
# - Ogni push e pull request: controllo dello stile (ruff) e test (pytest),
#   dentro la stessa immagine Docker usata in produzione.
# - Push su main: l'immagine viene pubblicata su GitHub Container Registry.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .

  test:
    runs-on: ubuntu-latest
    services:
      # Database usa e getta, solo per i test
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d test"
          --health-interval 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build dell'immagine
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: planetplotted:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Test unitari e di integrazione
        run: >
          docker run --rm --network host --entrypoint python
          -e TEST_PG_DSN=postgresql://test:test@localhost:5432/test
          planetplotted:ci -m pytest -q

  publish:
    # Solo sui push a main, e solo se stile e test sono passati
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [lint, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # permette al job di chiedere a GitHub il "documento d'identità" OIDC
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      # Scambia il documento d'identità di GitHub con credenziali AWS temporanee
      - name: Credenziali AWS (OIDC, nessuna chiave salvata)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: eu-north-1

      # Usa le credenziali per fare il login di Docker sul registro ECR
      - name: Login su ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build e pubblicazione su ECR
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/planetplotted:latest
            ${{ steps.ecr.outputs.registry }}/planetplotted:${{ github.sha }}
          cache-from: type=gha
