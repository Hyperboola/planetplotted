# CI/CD di Planet Plotted.
# - Ogni push e pull request: controllo dello stile (ruff) e test (pytest),
#   dentro la stessa immagine Docker usata in produzione.
# - Push su main: l'immagine viene pubblicata su GitHub Container Registry.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .

  test:
    runs-on: ubuntu-latest
    services:
      # Database usa e getta, solo per i test
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d test"
          --health-interval 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build dell'immagine
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: planetplotted:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Test unitari e di integrazione
        run: >
          docker run --rm --network host --entrypoint python
          -e TEST_PG_DSN=postgresql://test:test@localhost:5432/test
          planetplotted:ci -m pytest -q

  publish:
    # Solo sui push a main, e solo se stile e test sono passati
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [lint, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Nome dell'immagine (il registro vuole minuscole)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build e pubblicazione
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
