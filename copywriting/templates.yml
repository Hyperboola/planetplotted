# Modelli di testo per formato. I {segnaposto} vengono sostituiti con
# i numeri del post già formattati: non scrivere mai cifre a mano.
# Ogni formato ha più varianti; il post ne usa una in base al suo id.
# Campi: title (copertina / primo fotogramma), subtitle, reveal (solo ranked),
# closing (ultima slide), context (frase di contesto, solo ranked),
# caption (didascalia Instagram).

ranked:
  - title: "Where is {indicator_lc} highest?"
    subtitle: "{indicator}, {unit} · {year} · Top 10 of {n_countries} countries"
    reveal: "#1: {top1_label}"
    closing: "Last place: {last_name}, {last_value}"
    context: "{context_line}"
    caption: |
      #1 in {indicator_lc}: {top1_label} ({top1_value}).
      At the bottom of {n_countries} countries: {last_name}, {last_value}.
      Source: {source_name} ({source_code}), {year}.
  - title: "The top 10 countries for {indicator_lc}"
    subtitle: "{indicator}, {unit} · {year}"
    reveal: "And #1 is… {top1_label}"
    closing: "At the other end: {last_name}, {last_value}"
    context: "{context_line}"
    caption: |
      Ranked: {indicator_lc} across {n_countries} countries in {year}.
      Top spot: {top1_label} with {top1_value}.
      Source: {source_name} ({source_code}).
  - title: "Which country leads the world in {indicator_lc}?"
    subtitle: "{indicator}, {unit} · {year}"
    reveal: "#1: {top1_label}"
    closing: "Lowest of all: {last_name}, {last_value}"
    context: "{context_line}"
    caption: |
      #1: {top1_label}, {top1_value}. Last: {last_name}, {last_value}.
      Data for {n_countries} countries, {year}. Source: {source_name} ({source_code}).
  - title: "{indicator}: who's on top?"
    subtitle: "{unit} · {year} · {n_countries} countries"
    reveal: "#1: {top1_label}"
    closing: "And last: {last_name}, {last_value}"
    context: "{context_line}"
    caption: |
      Where does your country rank? #1 is {top1_label} ({top1_value}).
      Source: {source_name} ({source_code}), {year}.

the_gap:
  - title: "{indicator} in {highest} is {ratio} that of {lowest}"
    subtitle: "Highest and lowest among {n_countries} countries · {year}"
    closing: "{highest}: {highest_value} · {lowest}: {lowest_value}"
    caption: |
      {highest}: {highest_value}. {lowest}: {lowest_value}. That's {ratio}.
      {indicator}, {year}, {n_countries} countries. Source: {source_name} ({source_code}).
  - title: "The {indicator_lc} gap: {ratio}"
    subtitle: "{highest} vs {lowest} · {year}"
    closing: "{highest}: {highest_value} · {lowest}: {lowest_value}"
    caption: |
      The widest {indicator_lc} gap in the world: {highest} ({highest_value}) vs {lowest} ({lowest_value}).
      Source: {source_name} ({source_code}), {year}.
  - title: "{highest} vs {lowest}: a {ratio} gap in {indicator_lc}"
    subtitle: "{indicator}, {unit} · {year}"
    closing: "{highest}: {highest_value} · {lowest}: {lowest_value}"
    caption: |
      Same planet, {ratio} apart. {indicator} in {year}: {highest} {highest_value}, {lowest} {lowest_value}.
      Source: {source_name} ({source_code}).

# Usato per le percentuali: il divario si esprime in punti, non come rapporto
the_gap_points:
  - title: "{indicator}: from {lowest_value} to {highest_value}"
    subtitle: "{lowest} vs {highest} · {year}"
    closing: "A gap of {gap_points}"
    caption: |
      {highest}: {highest_value}. {lowest}: {lowest_value}. A gap of {gap_points}.
      {indicator}, {year}. {scope_note}. Source: {source_name} ({source_code}).
  - title: "A {gap_points_short} gap in {indicator_lc}"
    subtitle: "{highest} vs {lowest} · {year}"
    closing: "{highest}: {highest_value} · {lowest}: {lowest_value}"
    caption: |
      The widest {indicator_lc} gap: {highest} ({highest_value}) vs {lowest} ({lowest_value}).
      {scope_note}. Source: {source_name} ({source_code}), {year}.
  - title: "{highest} vs {lowest}: the {indicator_lc} gap"
    subtitle: "{highest_value} vs {lowest_value} · {year}"
    closing: "A gap of {gap_points}"
    caption: |
      Same planet, {gap_points} apart. {indicator}, {year}.
      {scope_note}. Source: {source_name} ({source_code}).
      
# Usato quando il rapporto non ha senso (valori zero o negativi)
the_gap_diff:
  - title: "{indicator}: from {highest_value} to {lowest_value}"
    subtitle: "{highest} vs {lowest} · {year}"
    closing: "A difference of {difference}"
    caption: |
      Highest: {highest} ({highest_value}). Lowest: {lowest} ({lowest_value}).
      {indicator}, {year}. Source: {source_name} ({source_code}).
  - title: "The extremes of {indicator_lc}"
    subtitle: "{highest} vs {lowest} · {year}"
    closing: "{highest}: {highest_value} · {lowest}: {lowest_value}"
    caption: |
      {indicator} in {year} ranges from {lowest_value} in {lowest} to {highest_value} in {highest}.
      Source: {source_name} ({source_code}).

mapped:
  - title: "{indicator}, mapped"
    subtitle: "{unit} · {year} · {n_countries} countries"
    closing: "Highest: {top3_names}"
    caption: |
      {indicator} around the world in {year}. Highest: {top1_name} ({top1_value}).
      Source: {source_name} ({source_code}).
  - title: "Every country's {indicator_lc}"
    subtitle: "{unit} · {year}"
    closing: "Top 3: {top3_names}"
    caption: |
      Find your country on the map. #1 is {top1_name} with {top1_value}.
      {n_countries} countries, {year}. Source: {source_name} ({source_code}).
  - title: "The world map of {indicator_lc}"
    subtitle: "{unit} · {year}"
    closing: "Leading: {top3_names}"
    caption: |
      {indicator}, {year}: {top1_name} leads with {top1_value}.
      Source: {source_name} ({source_code}).

then_vs_now:
  - title: "{indicator}: {base_year} vs {year}"
    subtitle: "{unit} · how the world changed"
    closing: "Biggest rise: {riser_name}, {riser_then} → {riser_now}"
    caption: |
      {indicator} from {base_year} to {year}. Biggest rise: {riser_name} ({riser_then} → {riser_now}).
      Biggest fall: {faller_name} ({faller_then} → {faller_now}).
      Source: {source_name} ({source_code}).
  - title: "How {indicator_lc} changed since {base_year}"
    subtitle: "{unit} · {base_year} → {year}"
    closing: "{riser_name}: {riser_then} → {riser_now}"
    caption: |
      {base_year} vs {year}. {riser_name} rose the most, {faller_name} fell the most.
      Source: {source_name} ({source_code}).
  - title: "{base_year} → {year}: {indicator_lc}"
    subtitle: "{unit}"
    closing: "Biggest fall: {faller_name}, {faller_then} → {faller_now}"
    caption: |
      Then vs now: {indicator_lc}, {base_year} vs {year}.
      Source: {source_name} ({source_code}).

world_in_one_chart:
  - title: "The world's {indicator_lc} in one chart"
    subtitle: "Share of the total · {year}"
    closing: "{top3_names}: {top3_share} of the total"
    caption: |
      {top1_name} alone accounts for {top1_share} of the total.
      Sum of {n_countries} countries with data, {year}. Source: {source_name} ({source_code}).
  - title: "Who holds the world's {indicator_lc}?"
    subtitle: "Share of the total · {year}"
    closing: "Top 3: {top3_share}"
    caption: |
      {top3_names} together: {top3_share}.
      {n_countries} countries, {year}. Source: {source_name} ({source_code}).
  - title: "{indicator}: the whole world, one chart"
    subtitle: "Share by country · {year}"
    closing: "#1: {top1_name}, {top1_share}"
    caption: |
      How the world's {indicator_lc} is split between {n_countries} countries.
      Source: {source_name} ({source_code}), {year}.