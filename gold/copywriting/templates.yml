# Modelli di testo per formato. I {segnaposto} vengono sostituiti con
# i numeri del post già formattati: non scrivere mai cifre a mano.
# Ogni formato ha più varianti; il post ne usa una in base al suo id.
# Campi: title (copertina / primo fotogramma), subtitle, reveal (solo ranked),
# closing (ultima slide), context (frase di contesto, solo ranked),
# caption (didascalia Instagram).
# Le parole sono neutre ("highest", "lowest", mai "best" o "top"): molti
# indicatori misurano cose negative, come la mortalità infantile.

ranked:
  - title: "Where is {indicator_lc} highest?"
    subtitle: "{indicator}, {unit} · {year} · Top 10 of {n_countries} countries and territories"
    reveal: "#1: {top1_label}"
    closing: "Lowest: {last_name}, {last_value}"
    context: "{context_line}"
    caption: |
      Highest {indicator_lc}: {top1_label} ({top1_value}).
      Lowest of {n_countries} countries and territories: {last_name}, {last_value}.
      Source: {source_name} ({source_code}), {year}.
  - title: "The 10 highest: {indicator_lc}"
    subtitle: "{indicator}, {unit} · {year}"
    reveal: "The highest: {top1_label}"
    closing: "The lowest: {last_name}, {last_value}"
    context: "{context_line}"
    caption: |
      Ranked: {indicator_lc} across {n_countries} countries and territories in {year}.
      Highest: {top1_label} with {top1_value}.
      Source: {source_name} ({source_code}).
  - title: "Which countries have the highest {indicator_lc}?"
    subtitle: "{indicator}, {unit} · {year}"
    reveal: "#1: {top1_label}"
    closing: "Lowest of all: {last_name}, {last_value}"
    context: "{context_line}"
    caption: |
      Highest: {top1_label}, {top1_value}. Lowest: {last_name}, {last_value}.
      Data for {n_countries} countries and territories, {year}. Source: {source_name} ({source_code}).
  - title: "{indicator}: the highest and the lowest"
    subtitle: "{unit} · {year} · {n_countries} countries and territories"
    reveal: "Highest: {top1_label}"
    closing: "Lowest: {last_name}, {last_value}"
    context: "{context_line}"
    caption: |
      Where does your country rank? Highest: {top1_label} ({top1_value}).
      Source: {source_name} ({source_code}), {year}.

the_gap:
  - title: "{indicator} in {highest} is {ratio} that of {lowest}"
    subtitle: "Highest and lowest among {n_countries} countries and territories · {year}"
    closing: "{highest}: {highest_value} · {lowest}: {lowest_value}"
    caption: |
      {highest}: {highest_value}. {lowest}: {lowest_value}. That's {ratio}.
      {indicator}, {year}, {n_countries} countries and territories. Source: {source_name} ({source_code}).
  - title: "The {indicator_lc} gap: {ratio}"
    subtitle: "{highest} vs {lowest} · {year}"
    closing: "{highest}: {highest_value} · {lowest}: {lowest_value}"
    caption: |
      The widest {indicator_lc} gap in the world: {highest} ({highest_value}) vs {lowest} ({lowest_value}).
      Source: {source_name} ({source_code}), {year}.
  - title: "{highest} vs {lowest}: a {ratio} gap in {indicator_lc}"
    subtitle: "{indicator}, {unit} · {year}"
    closing: "{highest}: {highest_value} · {lowest}: {lowest_value}"
    caption: |
      Same planet, {ratio} apart. {indicator} in {year}: {highest} {highest_value}, {lowest} {lowest_value}.
      Source: {source_name} ({source_code}).

# Usato per le percentuali: il divario si esprime in punti, non come rapporto
the_gap_points:
  - title: "{indicator}: from {lowest_value} to {highest_value}"
    subtitle: "{lowest} vs {highest} · {year}"
    closing: "A gap of {gap_points}"
    caption: |
      {highest}: {highest_value}. {lowest}: {lowest_value}. A gap of {gap_points}.
      {indicator}, {year}. {scope_note}. Source: {source_name} ({source_code}).
  - title: "A {gap_points_short} gap in {indicator_lc}"
    subtitle: "{highest} vs {lowest} · {year}"
    closing: "{highest}: {highest_value} · {lowest}: {lowest_value}"
    caption: |
      The widest {indicator_lc} gap: {highest} ({highest_value}) vs {lowest} ({lowest_value}).
      {scope_note}. Source: {source_name} ({source_code}), {year}.
  - title: "{highest} vs {lowest}: the {indicator_lc} gap"
    subtitle: "{highest_value} vs {lowest_value} · {year}"
    closing: "A gap of {gap_points}"
    caption: |
      Same planet, {gap_points} apart. {indicator}, {year}.
      {scope_note}. Source: {source_name} ({source_code}).

# Usato quando il rapporto non ha senso (valori zero o negativi)
the_gap_diff:
  - title: "{indicator}: from {highest_value} to {lowest_value}"
    subtitle: "{highest} vs {lowest} · {year}"
    closing: "A difference of {difference}"
    caption: |
      Highest: {highest} ({highest_value}). Lowest: {lowest} ({lowest_value}).
      {indicator}, {year}. Source: {source_name} ({source_code}).
  - title: "The extremes of {indicator_lc}"
    subtitle: "{highest} vs {lowest} · {year}"
    closing: "{highest}: {highest_value} · {lowest}: {lowest_value}"
    caption: |
      {indicator} in {year} ranges from {lowest_value} in {lowest} to {highest_value} in {highest}.
      Source: {source_name} ({source_code}).

mapped:
  - title: "{indicator}, mapped"
    subtitle: "{unit} · {year} · {n_countries} countries and territories"
    closing: "Highest: {top3_names}"
    caption: |
      {indicator} around the world in {year}. Highest: {top1_name} ({top1_value}).
      Source: {source_name} ({source_code}).
  - title: "Every country's {indicator_lc}"
    subtitle: "{unit} · {year}"
    closing: "Highest of all: {top3_names}"
    caption: |
      Find your country on the map. Highest: {top1_name} with {top1_value}.
      {n_countries} countries and territories, {year}. Source: {source_name} ({source_code}).
  - title: "The world map of {indicator_lc}"
    subtitle: "{unit} · {year}"
    closing: "Highest values: {top3_names}"
    caption: |
      {indicator}, {year}: highest in {top1_name}, with {top1_value}.
      Source: {source_name} ({source_code}).

then_vs_now:
  - title: "{indicator}: {base_year} vs {year}"
    subtitle: "{unit} · how the world changed"
    closing: "{trend_line}"
    caption: |
      {indicator} from {base_year} to {year}. {trend_line}
      Biggest change: {mover_name} ({mover_then} → {mover_now}).
      Source: {source_name} ({source_code}).
  - title: "How {indicator_lc} changed since {base_year}"
    subtitle: "{unit} · {base_year} → {year}"
    closing: "The middle country: {median_then} → {median_now}"
    caption: |
      {base_year} vs {year}: the median went from {median_then} to {median_now}.
      {trend_line} Source: {source_name} ({source_code}).
  - title: "{base_year} → {year}: {indicator_lc}"
    subtitle: "{unit}"
    closing: "Biggest change: {mover_name}, {mover_change}"
    caption: |
      Then vs now: {indicator_lc}, {base_year} vs {year}.
      Biggest change: {mover_name} ({mover_change}). {trend_line}
      Source: {source_name} ({source_code}).

world_in_one_chart:
  - title: "The world's {indicator_lc} in one chart"
    subtitle: "Share of the total · {year}"
    closing: "Half of the total comes from just {n_to_half_label}"
    caption: |
      {top1_name} alone accounts for {top1_share} of the total, and half of it comes from just {n_to_half_label}.
      Sum of {n_countries} countries and territories with data, {year}. Source: {source_name} ({source_code}).
  - title: "Who holds the world's {indicator_lc}?"
    subtitle: "Share of the total · {year}"
    closing: "{top3_names}: {top3_share} of the total"
    caption: |
      {top3_names} together: {top3_share}. The top 10: {top10_share}.
      {n_countries} countries and territories, {year}. Source: {source_name} ({source_code}).
  - title: "{indicator}: the whole world, one chart"
    subtitle: "Share by country · {year}"
    closing: "The top 10 hold {top10_share} of the total"
    caption: |
      How the world's {indicator_lc} is split between {n_countries} countries and territories.
      #1: {top1_name}, {top1_share}. Source: {source_name} ({source_code}), {year}.

# --- Formati solo reel (serie storiche) -----------------------------------

bar_race:
  - title: "{indicator}: the race since {start_year}"
    subtitle: "Top 10 countries · {unit} · {start_year}–{year}"
    closing: "Highest in {year}: {leader_end}, {leader_end_value}"
    caption: |
      {start_year} to {year}: who has had the highest {indicator_lc}? {n_leaders} different countries held the #1 spot.
      Highest in {year}: {leader_end} ({leader_end_value}). Source: {source_name} ({source_code}).
  - title: "Who has the highest {indicator_lc}? {start_year}–{year}"
    subtitle: "Top 10 · {unit}"
    closing: "In {start_year}: {leader_start}. In {year}: {leader_end}"
    caption: |
      The top 10 in {indicator_lc}, year by year since {start_year}. Watch until the end.
      Source: {source_name} ({source_code}).

line_race:
  - title: "{indicator}: {start_year} → {year}"
    subtitle: "{unit} · {names}"
    closing: "Highest in {year}: {leader_end}, {leader_end_value}"
    caption: |
      How {names} compare on {indicator_lc} since {start_year}.
      Source: {source_name} ({source_code}).
  - title: "The {indicator_lc} race since {start_year}"
    subtitle: "{unit} · the highest today, and how they got there"
    closing: "{leader_end} ends on top: {leader_end_value}"
    caption: |
      {start_year} to {year}: {indicator_lc} in {names}.
      Source: {source_name} ({source_code}).



duel:
  - title: "{a_name} vs {b_name}: {indicator_lc}"
    subtitle: "{unit} · {start_year}–{year} · who's ahead?"
    closing: "{duel_story}"
    caption: |
      {duel_story}. In {year}: {ahead_name} {ahead_value}, {behind_name} {behind_value}.
      Source: {source_name} ({source_code}).
  - title: "{indicator}: {a_name} or {b_name}?"
    subtitle: "{start_year}–{year} · guess before the end"
    closing: "{duel_story}"
    caption: |
      Did you guess right? {duel_story}.
      {indicator}, {start_year}–{year}. Source: {source_name} ({source_code}).

scroll_ranking:
  - title: "Every country ranked: {indicator_lc}"
    subtitle: "{n_countries} countries and territories · {year} · find yours"
    closing: "Where is your country? Tell us in the comments"
    caption: |
      All {n_countries} countries and territories, from {top1_name} ({top1_value}) to {last_name} ({last_value}).
      Where does yours rank? Source: {source_name} ({source_code}), {year}.
  - title: "{indicator}: the full ranking"
    subtitle: "{year} · pause to find your country"
    closing: "#1: {top1_name}, {top1_value}"
    caption: |
      The full list, {n_countries} countries and territories. Find yours and comment.
      Source: {source_name} ({source_code}), {year}.

globe:
  - title: "{indicator}, around the globe"
    subtitle: "{unit} · latest data · three views of the world"
    closing: "Highest of all: {top3_names}"
    caption: |
      {indicator} seen from space: the Americas, Europe and Africa, Asia and Oceania.
      Highest: {top1_name} ({top1_value}). Latest available data for each country, {year}.
      Source: {source_name} ({source_code}).
  - title: "The world of {indicator_lc}, one side at a time"
    subtitle: "{unit} · latest data for each country"
    closing: "Highest values: {top3_names}"
    caption: |
      Swipe around the globe: {indicator_lc} in every region. Save it for later.
      Source: {source_name} ({source_code}), {year}.
